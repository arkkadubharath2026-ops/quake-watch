[project]
name = "quakewatch"
version = "0.1.0"
description = "Real-time earthquake intelligence, revision-aware analytics, and reproducible seismic-data exploration (ArangoDB + Django)."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["static/vendor", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "C4", "DTZ", "SIM", "RUF", "PT", "RET", "TID"]
ignore = ["S101"]  # assert is idiomatic in pytest

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"**/migrations/**" = ["RUF012"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"requests".msg = "Use httpx through apps.ingestion.adapters (ESD: external APIs behind adapters)."

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
ignore_missing_imports = false
exclude = ["tests/", "migrations/", "\\.venv/", "\\.claude/"]

[[tool.mypy.overrides]]
module = ["arango.*", "celery.*", "kombu.*", "rest_framework.*", "whitenoise.*", "respx.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires a running ArangoDB (docker compose up -d arangodb)",
  "e2e: browser end-to-end tests against a running server",
  "perf: performance benchmarks (slow)",
  "live: calls the real USGS API (opt-in with -m live)",
]
filterwarnings = ["error::DeprecationWarning:apps.*"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]
